name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: badminton_test
          POSTGRES_USER: badminton
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U badminton -d badminton_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: badminton_test
      DB_USER: badminton
      DB_PASSWORD: test_only_password
      AI_ENABLED: 'false'
      RUN_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash mvnw verify
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated E2E services
        run: |
          node frontend/e2e/provider-fixture.mjs > provider-fixture.log 2>&1 &
          AI_ENABLED=true SERVER_PORT=18080 DEEPSEEK_API_KEY=test-placeholder DEEPSEEK_BASE_URL=http://127.0.0.1:19191 java -jar backend/target/*.jar > backend-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18080/actuator/health
          PGPASSWORD=test_only_password psql -h localhost -U badminton -d badminton_test -v ON_ERROR_STOP=1 -f backend/src/test/resources/sql/basic-ai-fixture.sql
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            backend-e2e.log
            frontend/test-results/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
