name: badminton-booking

services:
  postgres:
    image: postgres:17
    container_name: badminton-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-badminton_booking}
      POSTGRES_USER: ${DB_USER:-badminton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badminton_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: