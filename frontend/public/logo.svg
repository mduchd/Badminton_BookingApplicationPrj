<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Nền phẳng xanh thể thao chuẩn SmashCourt (Bo góc phong cách App Icon) -->
  <rect width="512" height="512" rx="104" fill="#1b7a42"/>
  
  <!-- Biểu tượng Feather Quả cầu lông ở giữa -->
