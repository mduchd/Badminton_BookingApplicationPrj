<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmashCourt - Hệ thống Đặt sân Cầu lông Thông minh</title>

  </head>
  <body>
    <div id="root">
      <!-- Global Initial Loader (Hiển thị ngay khi tải trang trước khi bundle JS nạp xong) -->
      <div style="position: fixed; inset: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Inter', system-ui, -apple-system, sans-serif; user-select: none;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #1b7a42; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-45deg);">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
              <line x1="17.5" y1="15" x2="9" y2="15" />
            </svg>
          </div>
          <span style="font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: #0f172a; font-size: 24px; white-space: nowrap;">SMASHCOURT</span>
        </div>
        <div style="margin-top: 24px; width: 200px; height: 6px; background-color: #f1f5f9; border-radius: 9999px; overflow: hidden;">
          <div style="width: 35%; height: 100%; background-color: #1b7a42; border-radius: 9999px; animation: smashInitialBar 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes smashInitialBar {
          0% { transform: translateX(-100%); width: 25%; }
          50% { width: 55%; }
          100% { transform: translateX(350%); width: 25%; }
        }
      </style>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
