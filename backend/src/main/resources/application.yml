spring:
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: badminton-booking

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    basedir: ${TOMCAT_BASEDIR:target/tomcat}

booking:
  hold-duration-minutes: ${BOOKING_HOLD_DURATION_MINUTES:10}
ai:
  enabled: ${AI_ENABLED:true}
payos:
  enabled: ${PAYOS_ENABLED:true}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:12}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:smashcourt/facilities}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    from: ${MAIL_FROM:}
  push:
    enabled: ${PUSH_ENABLED:false}
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
  integrations:
    encryption-key: ${INTEGRATIONS_ENCRYPTION_KEY:}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  google:
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    calendar-redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:}
    client-id: ${GOOGLE_CLIENT_ID:329281674145-bbkiipcmkff46lqraifh7fcatsg225vv.apps.googleusercontent.com}
