spring:
  application:
    name: badminton-booking

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    basedir: ${TOMCAT_BASEDIR:target/tomcat}

booking:
  hold-duration-minutes: ${BOOKING_HOLD_DURATION_MINUTES:10}
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:12}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:smashcourt/facilities}
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  google:
    client-id: ${GOOGLE_CLIENT_ID:329281674145-bbkiipcmkff46lqraifh7fcatsg225vv.apps.googleusercontent.com}
