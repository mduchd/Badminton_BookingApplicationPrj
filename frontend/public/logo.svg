    </g>
  </g>

  <!-- Chữ tên thương hiệu SMASHCOURT -->
  <text x="256" y="380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SMASHCOURT</text>
  
