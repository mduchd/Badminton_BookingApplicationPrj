spring:
  application:
    name: badminton-booking

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  tomcat:
    basedir: target/tomcat

booking:
  hold-duration-minutes: 10
