spring:
  application:
    name: badminton-booking

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:8080}
  tomcat:
    basedir: ${TOMCAT_BASEDIR:target/tomcat}

booking:
  hold-duration-minutes: 10
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:329281674145-bbkiipcmkff46lqraifh7fcatsg225vv.apps.googleusercontent.com}
